<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交通事故の訴状</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #d9d9dc;
    --maru: #0b6e4f; --batsu: #b3261e; --suggest: #fff3a8; --suggest-line: #e0b100;
    --btn: #f0f0f2; --btn-on: #1d1d1f; --hit: rgba(255, 196, 0, .35); --hit-line: #e0a000; --ai: #5b3fb3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; background: var(--bg); color: var(--text);
         font-size: 14px; display: grid; grid-template-rows: auto auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header .title { font-weight: bold; margin-right: auto; }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); background: var(--btn);
           border-radius: 4px; cursor: pointer; color: var(--text); }
  button:hover { border-color: #999; }
  button.primary { background: var(--maru); color: #fff; border-color: var(--maru); }
  button.ai { background: var(--ai); color: #fff; border-color: var(--ai); }
  button.link { border: none; background: none; color: #0b57d0; padding: 0 4px; text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 12px; }
  nav button.on { border-bottom-color: var(--btn-on); font-weight: bold; }
  nav button .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
                    font-size: 11px; background: #fde2e1; color: var(--batsu); }
  nav button .ok { color: var(--maru); margin-left: 3px; }
  main { overflow: auto; padding: 12px 16px 60px; }
  section { display: none; max-width: 1400px; margin: 0 auto; }
  section.on { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  .card h3 { font-size: 14px; margin: 12px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); }
  th, td { border-bottom: 1px solid #ececef; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { white-space: nowrap; background: #fafafa; font-size: 12px; color: var(--muted); font-weight: normal; }
  td input, td select, td textarea { width: 100%; min-width: 4em; }
  input, select, textarea { font: inherit; padding: 3px 5px; border: 1px solid #c8c8cc; border-radius: 3px; background: #fff; }
  textarea { width: 100%; min-height: 3.2em; resize: vertical; }
  .form { display: grid; grid-template-columns: 11em 1fr; gap: 6px 10px; align-items: center; }
  .form label { color: var(--muted); font-size: 13px; }
  .form .wide { grid-column: 1 / -1; }
  .help { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-right: 4px; white-space: nowrap; }
  .b-rule { background: #eef1f6; color: #34465e; }
  .b-ai { background: #ece6fb; color: var(--ai); }
  .b-j { background: var(--suggest); color: #6b4a00; border: 1px solid var(--suggest-line); }
  .b-done { background: #e3f5ef; color: var(--maru); }
  .b-warn { background: #fde2e1; color: var(--batsu); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; white-space: nowrap; }
  .seg button { border: none; border-radius: 0; padding: 4px 10px; background: var(--panel); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on.m { background: var(--maru); color: #fff; }
  .seg button.on.b { background: var(--batsu); color: #fff; }
  .seg button.on.n { background: #6b6b70; color: #fff; }
  /* 確認画面 */
  .review { display: grid; grid-template-columns: 240px minmax(320px, 1fr) minmax(420px, 1.1fr); gap: 12px; align-items: start; }
  .files { max-height: calc(100vh - 150px); overflow: auto; }
  .files .f { padding: 6px 8px; border-bottom: 1px solid #ececef; cursor: pointer; word-break: break-all; }
  .files .f:hover { background: #f7f7f9; }
  .files .f.on { background: #e7f0ff; }
  .viewer { position: sticky; top: 0; }
  .pagewrap { position: relative; display: inline-block; border: 1px solid var(--line); background: #fff; max-width: 100%; }
  .pagewrap img { display: block; max-width: 100%; height: auto; }
  .hl { position: absolute; background: var(--hit); outline: 2px solid var(--hit-line); pointer-events: none; }
  .cands .c { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
  .cands .c.j { border-color: var(--suggest-line); }
  .cands .c.applied { border-left: 4px solid var(--maru); }
  .cands .c .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .cands .c .head .lab { font-weight: bold; margin-right: auto; }
  .cands .c .fields { display: grid; grid-template-columns: 9em 1fr; gap: 4px 8px; align-items: center; }
  .cands .c .fields label { font-size: 12px; color: var(--muted); }
  .note { font-size: 12px; color: #7a5200; margin-top: 4px; }
  .quote { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .msg { white-space: pre-wrap; margin: 0; line-height: 1.6; }
  .err { color: var(--batsu); }
  .list li { margin: 3px 0; }
  .totals td { font-size: 15px; }
  .totals td.num { text-align: right; font-weight: bold; }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: none; align-items: center;
          justify-content: center; font-size: 16px; z-index: 10; flex-direction: column; gap: 6px; }
  #busy.on { display: flex; }
  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 560px; background: #1d1d1f; color: #fff;
           padding: 10px 14px; border-radius: 6px; display: none; white-space: pre-wrap; z-index: 11; }
  #toast.on { display: block; }
  #toast.error { background: var(--batsu); }
  .warnbox { background: #fff7e0; border: 1px solid #f0c040; color: #6b4a00; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .rowbtn { padding: 2px 6px; font-size: 12px; }
  @media (max-width: 1100px) { .review { grid-template-columns: 1fr; } .viewer { position: static; } }
</style>
</head>
<body>
<header>
  <span class="title" id="caseName">…</span>
  <span class="muted small" id="saved"></span>
  <button id="btnSave" title="Ctrl+S">保存</button>
  <button id="btnQuit">終了</button>
</header>
<nav id="tabs"></nav>
<main>
  <section id="s-evidence">
    <div class="bar">
      <button id="btnReadAll" class="primary">まだ読んでいない証拠を全部読む</button>
      <span class="muted small">証拠PDFを読み、項目の候補を拾います。候補を ○／× にして「反映」を押すと、入力に入ります。</span>
    </div>
    <div class="review">
      <div class="card files" id="fileList"></div>
      <div class="viewer card" id="viewer"><div class="empty">左の一覧から証拠を選んでください</div></div>
      <div id="candPane"></div>
    </div>
  </section>
  <section id="s-jiko"></section>
  <section id="s-injury"></section>
  <section id="s-damage"></section>
  <section id="s-busson"></section>
  <section id="s-judge"></section>
  <section id="s-text"></section>
  <section id="s-build"></section>
  <section id="s-settings"></section>
  <section id="s-json"></section>
</main>
<div id="busy"><div id="busyLabel">処理中…</div><div class="muted small" id="busySub"></div></div>
<div id="toast"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
let D = null;            // サーバーのデータ
let C = null;            // 編集中の case
let dirty = false;
let curFile = null, curView = null, curPage = 1, curHl = null;
const STEPS = [
  ["evidence", "① 証拠を読む"], ["jiko", "② 事故・当事者"], ["injury", "③ けが・治療"], ["damage", "④ 損害"],
  ["busson", "⑤ 物損"], ["judge", "⑥ 判断・不明点"], ["text", "⑦ 訴状の文章"], ["build", "⑧ 書面を作る"],
  ["settings", "設定"], ["json", "詳細（case.json）"]];
let curTab = "evidence";

// --- 小道具 ---
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                         body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: "応答が読めません"}));
  if (!r.ok) throw new Error(j.error || ("エラー " + r.status));
  return j;
}
function toast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "on" + (isError ? " error" : "");
  clearTimeout(toast.t);
  if (!isError) toast.t = setTimeout(() => t.className = "", 4000);
  else t.onclick = () => t.className = "";
}
async function busy(label, fn, sub) {
  const b = document.getElementById("busy");
  document.getElementById("busyLabel").textContent = label;
  document.getElementById("busySub").textContent = sub || "";
  b.className = "on";
  try { return await fn(); }
  catch (e) { toast(e.message, true); throw e; }
  finally { b.className = ""; }
}
const get = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
function set(obj, path, v) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) {
    if (o[path[i]] == null) o[path[i]] = typeof path[i + 1] === "number" ? [] : {};
    o = o[path[i]];
  }
  o[path[path.length - 1]] = v;
}
const P = s => s.split(".");
function markDirty() { dirty = true; document.getElementById("saved").textContent = "未保存"; }

// --- 値の変換（画面の文字 ⇔ case.json の値）---
function toCase(type, s) {
  s = (s ?? "").toString().trim();
  if (type === "int") { if (s === "") return null; const n = parseInt(s.replace(/,/g, ""), 10); return isNaN(n) ? s : n; }
  if (type === "rate") { if (s === "") return null; const n = parseFloat(s); return isNaN(n) ? s : n; }
  if (type === "amountx") {   // 数字か、"akai"（赤い本）・"shufu"（主婦）
    if (s === "") return null; if (/^[\d,]+$/.test(s)) return parseInt(s.replace(/,/g, ""), 10); return s; }
  if (type === "date" || type === "time") return s === "" ? null : s;
  if (type === "evs") return s === "" ? [] : s.split(/[,、\s]+/).filter(Boolean);
  if (type === "lines") return s === "" ? [] : s.split("\n").map(x => x.trim()).filter(Boolean);
  if (type === "bool") return !!s;
  return s;
}
function toView(type, v) {
  if (v === null || v === undefined) return "";
  if (type === "evs") return (v || []).join(", ");
  if (type === "lines") return (v || []).join("\n");
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}
function input(type, value, onchange, options) {
  let e;
  if (type === "choice") {
    e = el("select", {}, (options || []).map(o => el("option", {value: o}, o === "" ? "（選ぶ）" : o)));
    if (value && !(options || []).includes(value)) e.append(el("option", {value}, value));
    e.value = value ?? "";
  } else if (type === "textarea" || type === "lines") {
    e = el("textarea", {rows: type === "lines" ? 4 : 3}); e.value = value ?? "";
  } else if (type === "bool") {
    e = el("input", {type: "checkbox"}); e.checked = !!value;
    e.addEventListener("change", () => onchange(e.checked ? "1" : ""));
    return e;
  } else {
    const t = type === "date" ? "date" : type === "time" ? "time" : "text";
    e = el("input", {type: t, inputmode: ["int", "rate", "amountx"].includes(type) ? "decimal" : null}); e.value = value ?? "";
    if (type === "evs") e.setAttribute("list", "evkeys");
  }
  e.addEventListener("change", () => onchange(e.value));
  return e;
}

// --- 入力欄の定義 ---
const VTYPES = ["普通乗用自動車", "普通貨物自動車", "大型乗用自動車", "大型貨物自動車", "普通自動二輪車", "小型自動二輪車",
                "原動機付自転車", "自転車", "電動アシスト付き自転車", "歩行者"];
const ITEM_KEYS = ["装具代", "入院雑費", "入院付添費", "通院慰謝料", "後遺障害慰謝料", "死亡慰謝料", "任意保険金(治療費)",
                   "任意保険金(その他)", "弁護士費用"];
const BUSSON_KEYS = ["車両修理費", "レッカー費用", "代車費用", "車両時価額", "買替諸費用", "評価損", "休車損害"];

function formFields(title, help, fields) {   // fields: [path, label, type, options]
  const card = el("div", {class: "card"}, el("h2", {}, title), help ? el("div", {class: "help"}, help) : null);
  const g = el("div", {class: "form"});
  for (const [path, label, type, options, wide] of fields) {
    const p = P(path);
    g.append(el("label", {class: wide ? "wide" : null}, label));
    const inp = input(type, toView(type, get(C, p)), v => { set(C, p, toCase(type, v)); markDirty(); }, options);
    if (wide) inp.classList.add("wide");
    g.append(inp);
  }
  card.append(g);
  return card;
}
function tableEditor(title, help, path, cols, makeRow, filter) {
  // cols: [key or index, label, type, options]
  const card = el("div", {class: "card"}, el("h2", {}, title), help ? el("div", {class: "help"}, help) : null);
  const p = P(path);
  const draw = () => {
    card.querySelectorAll("table, .addbtn").forEach(x => x.remove());
    const rows = get(C, p) || [];
    const t = el("table", {}, el("tr", {}, cols.map(c => el("th", {}, c[1])), el("th", {}, "")));
    rows.forEach((row, i) => {
      if (filter && !filter(row)) return;
      const tr = el("tr");
      for (const [k, , type, options] of cols) {
        tr.append(el("td", {}, input(type, toView(type, row[k]), v => { row[k] = toCase(type, v); markDirty(); }, options)));
      }
      tr.append(el("td", {}, el("button", {class: "rowbtn", title: "この行を消す",
        onclick: () => { rows.splice(i, 1); markDirty(); draw(); }}, "消す")));
      t.append(tr);
    });
    card.append(t, el("button", {class: "addbtn rowbtn", onclick: () => {
      if (!get(C, p)) set(C, p, []);
      get(C, p).push(makeRow()); markDirty(); draw(); }}, "＋ 行を足す"));
  };
  draw();
  return card;
}
function evidenceEditor() {
  const card = el("div", {class: "card"}, el("h2", {}, "証拠"),
    el("div", {class: "help"}, "証拠番号（甲001…）は書面を作るときに自動で振ります。ここではキーで管理します。① で確認した証拠はここに入ります。"));
  const draw = () => {
    card.querySelectorAll("table, .addbtn").forEach(x => x.remove());
    const ev = C.evidence || (C.evidence = {});
    const t = el("table", {}, el("tr", {}, ["キー", "標目", "作成日", "作成者", "立証趣旨", "定型（kind）", ""].map(h => el("th", {}, h))));
    for (const key of Object.keys(ev)) {
      const e = ev[key];
      const keyIn = input("text", key, v => {
        v = v.trim(); if (!v || v === key || ev[v]) { draw(); return; }
        ev[v] = ev[key]; delete ev[key]; markDirty(); draw(); toast("キーを変えました。このキーを使っている欄（証拠の欄）も直してください"); });
      t.append(el("tr", {}, el("td", {}, keyIn),
        ...[["title", "text"], ["date", "date"], ["author", "text"], ["purpose", "text"]].map(([k, ty]) =>
          el("td", {}, input(ty, toView(ty, e[k]), v => { e[k] = toCase(ty, v); markDirty(); }))),
        el("td", {}, input("choice", e.kind || "", v => { if (v) e.kind = v; else delete e.kind; markDirty(); },
          ["", "bukken", "jikkyo", "keiji", "mitsumori", "ryoshu", "jika", "daisha", "tow", "adjuster", "shashin"])),
        el("td", {}, el("button", {class: "rowbtn", onclick: () => { delete ev[key]; markDirty(); draw(); }}, "消す"))));
    }
    card.append(t, el("button", {class: "addbtn rowbtn", onclick: () => {
      let k = "shoko", n = 1; while (ev[k]) k = "shoko_" + (++n);
      ev[k] = {title: "", date: null, author: "", purpose: ""}; markDirty(); draw(); }}, "＋ 証拠を足す"));
  };
  draw();
  return card;
}
function item(key, create) {
  C.songai = C.songai || {}; C.songai.items = C.songai.items || [];
  let it = C.songai.items.find(x => x.key === key);
  if (!it && create) { it = {key}; C.songai.items.push(it); }
  return it;
}

function renderJiko() {
  const s = document.getElementById("s-jiko"); s.replaceChildren();
  s.append(
    formFields("事件", null, [["meta.case_no", "事件番号", "text"], ["meta.plaintiff", "原告（表示用）", "text"],
                              ["meta.defendant", "被告（表示用）", "text"]]),
    formFields("事故", "「証拠」の欄には証拠キーを , で区切って入れます（例：jiko_shomei, jikkyo）。", [
      ["jiko.date", "事故日", "date"], ["jiko.time", "時刻", "time"], ["jiko.place", "場所", "text"],
      ["jiko.ev", "証拠", "evs"], ["jiko.situation", "現場の状況", "textarea"], ["jiko.situation_ev", "証拠", "evs"],
      ["jiko.mode", "事故の態様", "textarea"], ["jiko.mode_ev", "証拠", "evs"]]),
    tableEditor("関係車両（4台まで）", null, "jiko.vehicles",
      [["side", "どちら側", "choice", ["原告側", "被告側"]], ["type", "車種", "choice", [""].concat(VTYPES)],
       ["reg", "車両番号", "text"], ["driver", "運転者", "text"], ["owner", "所有者", "text"], ["ev", "証拠", "evs"]],
      () => ({side: "被告側", type: "", reg: "", driver: "被告", owner: "被告", ev: []})),
    tableEditor("責任原因（4件まで）", "判断：根拠条文と過失の内容。", "sekinin",
      [["subject", "誰の", "text"], ["basis", "根拠", "choice", ["民法７０９条", "民法７１５条", "自賠法３条", "その他"]],
       ["fault", "過失の内容", "textarea"], ["ev", "証拠", "evs"]],
      () => ({subject: "被告", basis: "民法７０９条", fault: "", ev: []})),
    formFields("訴状（当事者・提出先）", "mints用の訴状は「第１ 請求の趣旨」から始まります。当事者はmintsのフォームにも入れます。", [
      ["sojou.court", "提出先", "text"], ["sojou.date", "訴状の日付", "date"],
      ["sojou.plaintiff.name", "原告の氏名", "text"], ["sojou.plaintiff.zip", "原告の郵便番号", "text"],
      ["sojou.plaintiff.address", "原告の住所", "text"]]),
    tableEditor("被告", null, "sojou.defendants",
      [["name", "氏名・名称", "text"], ["zip", "郵便番号", "text"], ["address", "住所", "text"]],
      () => ({name: "", zip: "", address: ""})),
    evidenceEditor());
}

function renderInjury() {
  const s = document.getElementById("s-injury"); s.replaceChildren();
  if (!C.shogai) {
    s.append(el("div", {class: "card"}, el("p", {}, "人損（けが）の入力はまだありません。物損だけの事件ならこのままにします。"),
      el("button", {class: "primary", onclick: () => { C.shogai = {victim: "原告", treatment: [], fixed: [], kouisho: []}; markDirty(); renderInjury(); }},
         "人損の入力を始める")));
    return;
  }
  s.append(
    formFields("被害者", null, [["shogai.victim", "被害者", "text"], ["shogai.dob", "生年月日", "date"],
      ["shogai.job", "職業", "text"], ["shogai.job_ev", "証拠", "evs"], ["shogai.injuries", "傷病名", "textarea"],
      ["shogai.injuries_ev", "証拠", "evs"]]),
    tableEditor("治療（入院と通院は分ける。24行まで）", null, "shogai.treatment",
      [["hospital", "医療機関", "text"], ["type", "入院／通院", "choice", ["入院", "通院"]], ["start", "始まり", "date"],

  renderFiles();
  await busy("読み取っています…", async () => {
    curView = await api(force ? "/api/read" : (D.files.find(f => f.rel === rel)?.read ? "/api/file" : "/api/read"), {rel, force: !!force});
  }, "テキスト層のないページは tokumeiocr で読みます（1ページ十数秒）");
  await reload(true);
  drawViewer(); drawCands();
}
function drawViewer() {
  const v = document.getElementById("viewer"); v.replaceChildren();
  if (!curView) return;
  const img = el("img", {src: `/api/page?rel=${encodeURIComponent(curFile)}&p=${curPage}`, alt: "ページ"});
  const wrap = el("div", {class: "pagewrap"}, img);
  img.onload = () => {
    if (!curHl || curHl.page !== curPage) return;
    const z = img.clientWidth / (img.naturalWidth / 1.5);   // サーバーは 1.5倍で描く
    for (const r of curHl.rects) wrap.append(el("div", {class: "hl", style:
      `left:${r[0] * z - 2}px;top:${r[1] * z - 2}px;width:${(r[2] - r[0]) * z + 4}px;height:${(r[3] - r[1]) * z + 4}px`}));
  };
  const n = curView.pages;
  v.append(el("div", {class: "bar"},
    el("button", {disabled: curPage <= 1, onclick: () => { curPage--; drawViewer(); }}, "◀"),
    el("span", {}, `${curPage} / ${n} ページ`),
    el("button", {disabled: curPage >= n, onclick: () => { curPage++; drawViewer(); }}, "▶"),
    curView.unread.includes(curPage) ? el("span", {class: "badge b-warn"}, "このページは文字が読めませんでした") : null,
    el("button", {class: "rowbtn", onclick: () => openT("file:" + curFile)}, "PDFを開く")), wrap);
}
let pending = {};      // 候補id → {accepted, fields}
function drawCands() {
  const pane = document.getElementById("candPane"); pane.replaceChildren();
  if (!curView) return;
  pending = {};
  const aiOn = D.settings.ai && D.settings.ai.enabled;
  const head = el("div", {class: "card"},
    el("div", {class: "bar"}, el("b", {}, curView.kind_name), curView.evkey ? el("span", {class: "badge b-done"}, "証拠キー " + curView.evkey) : null),
    curView.warn ? el("div", {class: "warnbox"}, curView.warn) : null,
    curView.unread.length ? el("div", {class: "warnbox"}, `文字が読めなかったページ：${curView.unread.join("、")}。` +
      (D.settings.tokumeiocr_found ? "" : "tokumeiocr が見つからないため OCR していません。") + "ページを見て手入力するか、AIで読みます。") : null,
    el("div", {class: "bar"},
      el("button", {class: "primary", onclick: decide}, "反映（○を入力に入れる）"),
      el("button", {onclick: () => setAll(true)}, "未決を全部○"),
      el("button", {onclick: () => openFile(curFile, true)}, "読み直す"),
      aiOn ? el("button", {class: "ai", onclick: () => busy("AIが読んでいます…", async () => {
        curView = await api("/api/ai_read", {rel: curFile}); drawCands(); },
        "この書類のページ画像と文字を Bedrock に送ります")}, "AIで読む") : null),
    el("div", {class: "help"}, "○＝入れる、×＝入れない。値を直してから○にできます。黄色の枠は人が判断する項目です。「ページで見る」で拾った場所に枠が出ます。"));
  pane.append(head);
  const box = el("div", {class: "cands"});
  if (curView.cands.length <= 1) box.append(el("div", {class: "warnbox"}, "規則で拾えた項目がありませんでした。証拠の下書きを確かめ、ほかの項目は入力の画面で入れてください" + (aiOn ? "（AIで読むこともできます）" : "") + "。"));
  for (const c of curView.cands) box.append(candCard(c));
  pane.append(box);
}
function candCard(c) {
  const state = {accepted: c.accepted, fields: {}};
  pending[c.id] = state;
  const seg = el("span", {class: "seg"});
  const mk = (v, cls, label) => { const b = el("button", {class: cls + (state.accepted === v ? " on" : ""), onclick: () => {
    state.accepted = v; seg.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); }}, label); return b; };
  if (c.op.kind !== "info") seg.append(mk(true, "m", "○"), mk(false, "b", "×"), mk(null, "n", "未"));
  const fields = el("div", {class: "fields"});
  for (const f of c.fields) {
    fields.append(el("label", {}, f.label),
      input(f.vtype === "textarea" ? "textarea" : f.vtype === "choice" ? "choice" : f.vtype === "date" ? "date" : f.vtype === "time" ? "time" : "text",
        f.value, v => { state.fields[f.name] = v; }, f.options));
  }
  return el("div", {class: "c" + (c.judgment ? " j" : "") + (c.applied ? " applied" : "")},
    el("div", {class: "head"}, el("span", {class: "lab"}, c.label),
      el("span", {class: "badge " + (c.source === "AI" ? "b-ai" : "b-rule")}, c.source),
      c.judgment ? el("span", {class: "badge b-j"}, "要判断") : null, c.applied ? el("span", {class: "badge b-done"}, "入力済み") : null,
      c.page ? el("button", {class: "link", onclick: () => { curPage = c.page; curHl = {page: c.page, rects: c.rects || []}; drawViewer(); }},
        `ページで見る（${c.page}）`) : null, seg),
    fields, c.quote ? el("div", {class: "quote"}, "拾った文字：", c.quote) : null, c.note ? el("div", {class: "note"}, c.note) : null);
}
function setAll(v) {
  for (const c of curView.cands) if (c.op.kind !== "info" && pending[c.id].accepted == null) pending[c.id].accepted = v;
  decide();
}
async function decide() {
  if (dirty) await save();
  await busy("入力に入れています…", async () => {
    const r = await api("/api/decide", {rel: curFile, decisions: pending});
    curView = r.file; C = r.case;
    drawCands(); await reload(true);
    if (r.errors.length) toast("入れられなかった項目があります：\n" + r.errors.join("\n"), true);
    else toast("入力に入れました");
  });
}
async function readAll() {
  const todo = D.files.filter(f => !f.read);
  if (!todo.length) { toast("全部読んであります"); return; }
  await busy("読み取っています…", async () => {
    for (let i = 0; i < todo.length; i++) {
      document.getElementById("busyLabel").textContent = `読み取っています… ${i + 1} / ${todo.length}`;
      document.getElementById("busySub").textContent = todo[i].rel;
      await api("/api/read", {rel: todo[i].rel});
    }
  });
  await reload(true); toast(`${todo.length} 件読みました。上から順に確認してください`);
}

// --- 全体 ---
function renderTabs() {
  const nav = document.getElementById("tabs"); nav.replaceChildren();
  const ch = D ? D.checks : null;
  const badge = {evidence: D ? D.files.filter(f => !f.evkey).length : 0, judge: ch ? ch.judgment.length + ch.missing.length : 0};
  for (const [k, label] of STEPS) {
    nav.append(el("button", {class: curTab === k ? "on" : null, onclick: () => showTab(k)}, label,
      badge[k] ? el("span", {class: "dot"}, badge[k]) : null));
  }
}
function showTab(k) {
  curTab = k;
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "s-" + k));
  renderTabs();
  ({jiko: renderJiko, injury: renderInjury, damage: renderDamage, busson: renderBusson, judge: renderJudge,
    text: renderText, build: () => renderBuild(null), settings: renderSettings, json: renderJson})[k]?.();
  if (k === "evidence") renderFiles();
}
function evkeyList() {
  let dl = document.getElementById("evkeys");
  if (!dl) { dl = el("datalist", {id: "evkeys"}); document.body.append(dl); }
  dl.replaceChildren(...Object.keys(C.evidence || {}).map(k => el("option", {value: k})));
}
async function reload(keepCase) {
  D = await api("/api/data");
  if (!keepCase || !C || !dirty) C = D.case;
  document.getElementById("caseName").textContent = "交通事故の訴状 — " + D.case_name;
  evkeyList(); renderTabs(); renderFiles();
}
async function save() {
  const r = await api("/api/save_case", {case: C});
  dirty = false; D.checks = r.checks;
  document.getElementById("saved").textContent = "保存しました " + new Date().toLocaleTimeString();
  evkeyList(); renderTabs();
}
document.getElementById("btnSave").onclick = () => save().catch(e => toast(e.message, true));
document.getElementById("btnReadAll").onclick = () => readAll().catch(() => {});
document.getElementById("btnQuit").onclick = async () => {
  if (dirty) await save();
  await api("/api/quit", {});
  document.body.innerHTML = "<div class='empty' style='padding:60px'>終了しました。このタブを閉じてください。</div>";
};
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save().catch(x => toast(x.message, true)); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
document.querySelector("main").addEventListener("change", e => {   // 入力の画面を移るとき・離れるとき自動で保存
  if (e.target.closest("#s-evidence") || e.target.closest("#s-settings")) return;
  clearTimeout(save.t); save.t = setTimeout(() => { if (dirty) save().catch(x => toast(x.message, true)); }, 800);
});
reload().then(() => showTab(D.files.some(f => !f.evkey) ? "evidence" : "jiko")).catch(e => toast(e.message, true));
</script>
</body>
